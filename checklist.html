<!DOCTYPE html>
<html lang="en" style="background-color: #09090b; color: white;">

<head>
    <!-- wpt:head -->
    <script type="module" src="src/tools/checklist.js"></script>
</head>

<body class="min-h-screen flex flex-col grid-bg">

    <!-- Navbar Container -->
    <wpt-navbar></wpt-navbar>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">

        <header class="mb-10 text-center md:text-start flex flex-col md:flex-row justify-between items-center md:items-end gap-6">
            <div class="max-w-2xl min-w-0 w-full">
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tighter text-white break-words [overflow-wrap:anywhere] text-balance" data-i18n="tool_checklist_title">Website Checklist</h1>
                <p class="text-zinc-500 mt-2" data-i18n="tool_checklist_desc">Ensure your WordPress site is production-ready with a professional pre-launch checklist.</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto shrink-0">
                 <button type="button" id="import-btn" class="flex-1 md:flex-none shadcn-button shadcn-button-outline h-10 px-4 text-xs gap-2 border-zinc-800 hover:bg-zinc-900 transition-all">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                    <span data-i18n="btn_import_checklist">Import</span>
                </button>
                <input type="file" id="import-input" class="hidden" accept=".json">
                <button type="button" id="export-btn" class="flex-1 md:flex-none shadcn-button shadcn-button-outline h-10 px-4 text-xs gap-2 border-zinc-800 hover:bg-zinc-900 transition-all">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span data-i18n="btn_export_checklist">Export</span>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">

            <!-- Col 1: Sites List -->
            <div class="md:col-span-3 space-y-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-[10px] font-bold uppercase tracking-widest text-zinc-500" data-i18n="label_sites">Sites</h2>
                    <button type="button" id="add-site-btn" aria-label="Add New Site" class="w-8 h-8 rounded-full bg-primary/10 text-primary hover:bg-primary hover:text-white transition-all flex items-center justify-center">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="sites-list" class="space-y-2">
                    <!-- Sites injected here -->
                </div>
            </div>

            <!-- Col 2: Site Progress & Filters -->
            <div class="md:col-span-3 space-y-6 sticky top-24">
                <section class="shadcn-card p-6 bg-zinc-900/40">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xs font-bold uppercase tracking-[0.2em] text-zinc-500" data-i18n="label_progress">
                            Launch Readiness
                        </h2>
                        <span id="active-site-progress" class="text-sm font-mono text-primary">0%</span>
                    </div>
                    <div class="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
                        <div id="active-site-progress-bar" class="h-full bg-primary transition-all duration-500" style="width: 0%"></div>
                    </div>
                </section>

                <div id="category-filters" class="space-y-2">
                    <button type="button" id="filter-all" aria-pressed="true" class="filter-btn w-full text-start px-4 py-3 rounded-xl border border-primary/40 bg-zinc-900/80 text-white hover:bg-zinc-800 transition-all flex justify-between items-center group active" data-category="all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="layers" class="w-4 h-4 text-primary group-hover:text-primary"></i>
                            <span class="text-sm font-medium" data-i18n="cat_all_tasks">All Tasks</span>
                        </div>
                        <span id="count-all" class="text-[10px] font-bold bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-400">0</span>
                    </button>
                    <button type="button" id="filter-wp" aria-pressed="false" class="filter-btn w-full text-start px-4 py-3 rounded-xl border border-zinc-800 bg-zinc-900/50 hover:bg-zinc-800 transition-all flex justify-between items-center group" data-category="wp">
                        <div class="flex items-center gap-3">
                            <i data-lucide="layout" class="w-4 h-4 text-zinc-500 group-hover:text-primary"></i>
                            <span class="text-sm font-medium" data-i18n="cat_wp">WordPress</span>
                        </div>
                        <span id="count-wp" class="text-[10px] font-bold bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-500">0</span>
                    </button>
                    <button type="button" id="filter-seo" aria-pressed="false" class="filter-btn w-full text-start px-4 py-3 rounded-xl border border-zinc-800 bg-zinc-900/50 hover:bg-zinc-800 transition-all flex justify-between items-center group" data-category="seo">
                        <div class="flex items-center gap-3">
                            <i data-lucide="search" class="w-4 h-4 text-zinc-500 group-hover:text-primary"></i>
                            <span class="text-sm font-medium" data-i18n="cat_seo">SEO</span>
                        </div>
                        <span id="count-seo" class="text-[10px] font-bold bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-500">0</span>
                    </button>
                    <button type="button" id="filter-woo" aria-pressed="false" class="filter-btn w-full text-start px-4 py-3 rounded-xl border border-zinc-800 bg-zinc-900/50 hover:bg-zinc-800 transition-all flex justify-between items-center group" data-category="woo">
                        <div class="flex items-center gap-3">
                            <i data-lucide="shopping-cart" class="w-4 h-4 text-zinc-500 group-hover:text-primary"></i>
                            <span class="text-sm font-medium" data-i18n="cat_woo">WooCommerce</span>
                        </div>
                        <span id="count-woo" class="text-[10px] font-bold bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-500">0</span>
                    </button>
                </div>
            </div>

            <!-- Col 3: Tasks List Overlay -->
            <div class="md:col-span-6 space-y-6 min-h-[600px]">
                <div id="empty-checklist" class="shadcn-card border-2 border-dashed p-16 text-center flex flex-col items-center justify-center h-full min-h-[400px]">
                     <div class="w-16 h-16 bg-zinc-800/50 rounded-full flex items-center justify-center text-zinc-500 mb-6">
                        <i data-lucide="layout-list" class="w-8 h-8"></i>
                    </div>
                    <p class="text-xl font-semibold text-zinc-400" data-i18n="msg_select_site">Select a site to see its checklist</p>
                </div>

                <div id="checklist-content" class="hidden space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                         <h2 id="active-site-name" class="text-2xl font-bold text-white tracking-tight break-words min-w-0">Site Name</h2>
                         <div id="active-site-url-wrap" class="min-w-0"></div>
                    </div>

                    <div class="flex gap-2">
                        <label for="new-task-input" class="sr-only" data-i18n="placeholder_task_name">Add a custom task...</label>
                        <input type="text" id="new-task-input" class="flex-1 min-w-0 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all" data-i18n-placeholder="placeholder_task_name" placeholder="Add a custom task...">
                        <button type="button" id="add-task-btn" aria-label="Add custom task" class="shadcn-button shadcn-button-primary px-6 rounded-xl h-12 shadow-lg shadow-primary/20 shrink-0">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div id="tasks-container" class="space-y-3">
                        <!-- Tasks injected here -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Site Add Modal -->
    <dialog id="site-modal" closedby="any" aria-labelledby="site-modal-title"
        class="wpt-dialog w-[min(24rem,calc(100vw-2rem))] overscroll-contain">
        <div id="site-modal-card" class="shadcn-card w-full p-6 space-y-4">
            <h2 id="site-modal-title" class="text-lg font-bold text-white tracking-tight" data-i18n="modal_add_site">Add New Site</h2>
            <div class="space-y-4">
                <div>
                    <label for="site-name-input" class="sr-only" data-i18n="placeholder_site_name">Site name</label>
                    <input type="text" id="site-name-input" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-primary transition-all" data-i18n-placeholder="placeholder_site_name" placeholder="Site name...">
                </div>
                <div>
                    <label for="site-url-input" class="sr-only">Site URL (optional)</label>
                    <input type="url" id="site-url-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-primary transition-all" placeholder="https://example.com">
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-4">
                <button type="button" id="close-site-modal-btn" class="shadcn-button shadcn-button-outline px-4 text-xs" data-i18n="btn_cancel">Cancel</button>
                <button type="button" id="confirm-add-site-btn" class="shadcn-button shadcn-button-primary px-6 text-xs" data-i18n="btn_save_site">Save Site</button>
            </div>
        </div>
    </dialog>

    <!-- Task Edit Modal -->
    <dialog id="edit-modal" closedby="any" aria-labelledby="edit-modal-title"
        class="wpt-dialog w-[min(32rem,calc(100vw-2rem))] overscroll-contain">
        <div id="edit-modal-card" class="shadcn-card w-full p-6 space-y-4">
            <h2 id="edit-modal-title" class="text-lg font-bold text-white tracking-tight" data-i18n="modal_edit_task">Edit Task</h2>
            <div class="space-y-4">
                <div>
                    <label for="edit-task-input" class="sr-only" data-i18n="modal_edit_task">Edit Task</label>
                    <textarea id="edit-task-input" rows="4" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-primary transition-all resize-y"></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" id="close-edit-modal-btn" class="shadcn-button shadcn-button-outline px-4 text-xs" data-i18n="btn_cancel">Cancel</button>
                <button type="button" id="save-edit-task-btn" class="shadcn-button shadcn-button-primary px-6 text-xs" data-i18n="btn_save_changes">Save Changes</button>
            </div>
        </div>
    </dialog>

    <!-- Global Footer Container -->
    <wpt-footer></wpt-footer>

    <!-- Global Toast Container -->
    <div id="toast" popover="manual" role="status" aria-live="polite" aria-atomic="true" class="wpt-popover fixed bottom-8 end-8 translate-y-24 opacity-0 z-50">
        <div class="shadcn-card px-6 py-4 bg-zinc-900 border-zinc-800 text-white flex items-center gap-3 shadow-2xl">
            <i data-lucide="check-circle" class="w-4 h-4 text-green-400"></i>
            <span id="toast-msg" class="text-sm font-medium">Notification</span>
        </div>
    </div>
</body>
</html>
