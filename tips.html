<!DOCTYPE html>
<html lang="en" style="background-color: #09090b; color: white;">

<head>
    <!-- wpt:head -->
    <script type="module" src="src/tools/tips.js"></script>
</head>

<body class="min-h-screen flex flex-col grid-bg">

    <!-- Navbar Container -->
    <wpt-navbar></wpt-navbar>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">

        <header class="mb-10 text-center md:text-start">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tighter text-white break-words [overflow-wrap:anywhere] text-balance" data-i18n="tool_tips_title">Tips & Facts
            </h1>
            <p class="text-zinc-500 mt-2" data-i18n="tool_tips_desc">Obscure WordPress behavior, hosting bottlenecks,
                and clever production-tested
                solutions.</p>
        </header>

        <!-- Tips Grid -->
        <div id="tips-container" class="wpt-deferred grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Injected by JS -->
            <div class="col-span-full py-20 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-zinc-800 border-t-primary">
                </div>
            </div>
        </div>

        <!-- Call to action -->
        <div
            class="mt-20 p-6 sm:p-10 shadcn-card bg-primary text-primary-foreground rounded-2xl flex flex-col items-center text-center">
            <h2 class="text-2xl md:text-3xl font-bold tracking-tight mb-4 break-words [overflow-wrap:anywhere] text-balance" data-i18n="cta_ninja_title">Have a Ninja Tip?</h2>
            <p class="max-w-xl opacity-90 mb-8 font-medium" data-i18n="cta_ninja_desc">If you've encountered a
                hard-to-solve WordPress issue and
                found a clever fix, we want to hear it! Help other developers save hours of debugging.</p>
            <a href="https://x.com/hadealahmad" target="_blank" rel="noopener noreferrer"
                class="bg-white text-zinc-950 px-8 py-3 rounded-xl font-bold flex items-center gap-3 hover:scale-105 transition-all">
                <i data-lucide="twitter" class="w-5 h-5"></i>
                <span data-i18n="cta_ninja_btn">Submit a Tip</span>
            </a>
        </div>

    </main>

    <!-- Global Footer Container -->
    <wpt-footer></wpt-footer>

    <!-- Global Toast Container -->
    <div id="toast" popover="manual" role="status" aria-live="polite" aria-atomic="true"
        class="wpt-popover fixed bottom-8 end-8 translate-y-24 opacity-0 z-50">
        <div class="shadcn-card px-6 py-4 bg-zinc-900 border-zinc-800 text-white flex items-center gap-3 shadow-2xl">
            <i data-lucide="check-circle" class="w-4 h-4 text-green-400"></i>
            <span id="toast-msg" class="text-sm font-medium">Notification</span>
        </div>
    </div>
</body>

</html>
