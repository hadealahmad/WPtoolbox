    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var c = null;
      try { c = localStorage.getItem('wpt-consent'); } catch (e) {}
      var allGranted = c === 'all';
      var analyticsGranted = allGranted || c === 'granted';
      gtag('consent', 'default', {
        ad_storage: allGranted ? 'granted' : 'denied',
        ad_user_data: allGranted ? 'granted' : 'denied',
        ad_personalization: allGranted ? 'granted' : 'denied',
        analytics_storage: analyticsGranted ? 'granted' : 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
      gtag('js', new Date());
    </script>
